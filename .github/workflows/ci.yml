name: Verify console and recovery

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flowtrail_ci
          MYSQL_USER: flowtrail_ci
          # Public, disposable CI-only values. No deployed credential is used.
          MYSQL_PASSWORD: ci_test_only
          MYSQL_ROOT_PASSWORD: ci_root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FLOWTRAIL_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/flowtrail_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLOWTRAIL_TEST_MYSQL_USER: flowtrail_ci
      FLOWTRAIL_TEST_MYSQL_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser reports, recovery evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
